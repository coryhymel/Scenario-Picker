--spark:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" viewBox="0 0 44 44"><path fill="%2310292C" d="M22 6c1.2 7.5 6.5 12.8 14 14-7.5 1.2-12.8 6.5-14 14-1.2-7.5-6.5-12.8-14-14 7.5-1.2 12.8-6.5 14-14z"/></svg>');

/* ---- primary palette ---- */
--darker-kale:#10292C;--emerald:#338632;--dark-green-black:#424D53;--lighter-green-black:#E7E9EA;
--lightest-green-black:#F5F5F5;--almost-white:#FAFAFA;--white:#FFFFFF;
/* ---- secondary palette ---- */
--dark-kale:#1F3A3D;--teal:#307C84;--light-emerald:#7FC87C;--lighter-emerald:#D9EED8;
--lightest-emerald:#ECF7EC;--light-kale:#7CBFC7;--lighter-kale:#E0F3F5;--lightest-kale:#F0FAFB;
--opal:#B0D6CE;--light-opal:#E7F2F0;
/* ---- semantic ---- */
--text-primary:#10292C;--text-body:#424D53;--bg-page:#FAFAFA;--bg-card:#FFFFFF;--border:#E7E9EA;
/* ---- type ---- */
--font-serif:'Droid Serif',Georgia,serif;
--font-sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
/* ---- spacing scale ---- */
--s00:.125rem;--s01:.25rem;--s02:.5rem;--s03:.75rem;--s04:1rem;--s05:1.5rem;--s06:2rem;--s07:2.5rem;
--s08:3rem;--s09:3.5rem;--s10:4rem;--s11:4.5rem;--s12:5rem;--s13:5.5rem;--s14:6rem;--s15:6.5rem;
--s16:7rem;--s17:8rem;
/* ---- radii ---- */
--r-btn:8px;--r-card:12px;--r-lg:16px;--r-tag:20px;
/* ---- elevation ---- */
--sh-1:0 1px 3px rgba(16,41,44,.06),0 1px 2px rgba(16,41,44,.04);
--sh-2:0 4px 12px rgba(16,41,44,.08),0 2px 4px rgba(16,41,44,.04);
--sh-3:0 8px 24px rgba(16,41,44,.10),0 2px 6px rgba(16,41,44,.04);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg-page);color:var(--text-body);font-family:var(--font-sans);
  font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
/* Horizontal longhands only, never the margin/padding shorthands. .container also sits on
   <main> and <footer>, so a shorthand here out-specifies (0-1-0 vs 0-0-1) the vertical
   section padding and footer margin those element selectors set, silently zeroing them. */
.container{max-width:1280px;margin-left:auto;margin-right:auto;
  padding-left:var(--s06);padding-right:var(--s06)}
button{font-family:inherit;font-size:inherit}
::selection{background:var(--lighter-emerald);color:var(--text-primary)}

/* ================= top bar (header + breadcrumbs move together) ================= */
.topbar{position:sticky;top:0;z-index:30}
.hdr{background:var(--darker-kale);color:var(--white)}
.hrow{display:flex;align-items:center;gap:var(--s05);padding:var(--s04) 0}

/* real Andela lockup, rendered as a mask so it takes any brand colour */
.brand{display:flex;align-items:center;gap:var(--s04);background:none;border:0;padding:var(--s01) 0;
  cursor:pointer;color:var(--white);flex:none}
.lockup{width:118px;height:31px;background-color:currentColor;flex:none;
  -webkit-mask:var(--logo) left center/contain no-repeat;mask:var(--logo) left center/contain no-repeat}
.rule{width:1px;height:26px;background:rgba(255,255,255,.2);flex:none}
.wordmark{font-size:14px;font-weight:500;letter-spacing:-.3px;color:rgba(255,255,255,.82);white-space:nowrap}
.brand:hover .wordmark{color:var(--white)}
.brand:focus-visible{outline:2px solid var(--light-emerald);outline-offset:4px;border-radius:var(--r-btn)}

.searchwrap{flex:1;min-width:200px;position:relative;display:flex}
#q{width:100%;font-family:inherit;font-size:16px;padding:12px var(--s04) 12px var(--s07);
  border-radius:var(--r-btn);border:1.5px solid rgba(255,255,255,.16);
  background:rgba(255,255,255,.07);color:var(--white);transition:border-color .2s,background .2s}
#q::placeholder{color:rgba(255,255,255,.48)}
#q:focus{outline:none;border-color:var(--light-emerald);background:rgba(255,255,255,.13);
  box-shadow:0 0 0 3px rgba(127,200,124,.16)}
#q::-webkit-search-cancel-button{filter:invert(1);opacity:.5}
.sicon{position:absolute;left:var(--s04);top:50%;transform:translateY(-50%);opacity:.5;pointer-events:none}
.hbtn{background:transparent;border:1.5px solid rgba(255,255,255,.26);color:var(--white);
  border-radius:var(--r-btn);padding:12px var(--s05);font-size:14px;font-weight:600;cursor:pointer;
  transition:background .2s,border-color .2s;white-space:nowrap;flex:none}
.hbtn:hover{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.4)}
.hbtn:focus-visible{outline:2px solid var(--light-emerald);outline-offset:2px}
.hbtn.on{background:var(--emerald);border-color:var(--emerald)}

/* ================= breadcrumbs ================= */
.crumbs{background:var(--white);border-bottom:1px solid var(--border)}
.crow{display:flex;align-items:center;gap:var(--s02);padding:var(--s03) 0;flex-wrap:wrap;min-height:48px}
.crumb{background:var(--lightest-green-black);border:1px solid var(--border);color:var(--text-primary);
  border-radius:var(--r-tag);padding:6px 14px;font-size:12px;font-weight:600;cursor:pointer;
  transition:background .15s,border-color .15s;letter-spacing:.1px}
.crumb:hover{background:var(--lighter-emerald);border-color:var(--light-emerald)}
.crumb:focus-visible{outline:2px solid var(--emerald);outline-offset:2px}
.crumb.home{background:var(--darker-kale);color:var(--white);border-color:var(--darker-kale)}
.crumb.home:hover{background:var(--dark-kale)}
.crumb.now{background:var(--lighter-emerald);border-color:var(--light-emerald);cursor:default}
.sep{opacity:.35;font-size:13px;line-height:1}

/* */

/* ================= typography ================= */
h1.q{font-family:var(--font-serif);font-weight:400;font-size:clamp(1.9rem,3.6vw,2.75rem);
  line-height:1.17;letter-spacing:-.3px;color:var(--text-primary);margin:0 0 var(--s04);max-width:26ch}
h1.q.long{font-family:var(--font-sans);font-weight:600;font-size:clamp(1.4rem,2.5vw,2rem);
  line-height:1.24;max-width:40ch}
.lead{font-size:16px;line-height:1.6;max-width:64ch;margin:0}
.label{font-size:12px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;
  color:var(--emerald);margin:0 0 var(--s03)}
h2.sec{font-family:var(--font-sans);font-size:22px;font-weight:600;letter-spacing:-.3px;
  color:var(--text-primary);margin:var(--s10) 0 var(--s04)}
main{padding:var(--s09) 0 var(--s14)}
.back{background:none;border:0;color:var(--emerald);font-size:14px;font-weight:600;cursor:pointer;
  padding:var(--s02) 0;margin:0 0 var(--s05);display:inline-flex;align-items:center;gap:var(--s02)}
.back:hover{color:#2d7a2c;text-decoration:underline;text-underline-offset:3px}
.back:focus-visible{outline:2px solid var(--emerald);outline-offset:2px;border-radius:4px}

/* ================= option cards ================= */
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:var(--s05);margin-top:var(--s07)}
.opt{position:relative;text-align:left;background:var(--bg-card);border:1px solid var(--border);
  border-radius:var(--r-card);padding:var(--s06);cursor:pointer;box-shadow:var(--sh-1);
  transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease;
  display:flex;flex-direction:column;gap:var(--s03);min-height:130px}
.opt:hover{border-color:var(--emerald);box-shadow:var(--sh-3);transform:translateY(-3px)}
.opt:focus-visible{outline:none;border-color:var(--emerald);box-shadow:0 0 0 3px rgba(51,134,50,.16),var(--sh-2)}
.opt .num{position:absolute;top:var(--s04);right:var(--s04);width:22px;height:22px;border-radius:6px;
  background:var(--lightest-green-black);border:1px solid var(--border);color:var(--text-body);
  font-size:12px;font-weight:600;display:grid;place-items:center}
.opt:hover .num{background:var(--lightest-emerald);border-color:var(--lighter-emerald);color:var(--emerald)}
.opt .otxt{font-size:18px;font-weight:600;color:var(--text-primary);letter-spacing:-.3px;
  padding-right:var(--s07);line-height:1.3}
.opt .otxt.small{font-size:16px;font-weight:500;line-height:1.4}
.opt .onext{font-size:12px;color:var(--text-body);opacity:.75;display:flex;align-items:center;
  gap:var(--s02);margin-top:auto;padding-top:var(--s02)}
.dotg{width:6px;height:6px;border-radius:50%;background:var(--emerald);flex:none}

/* ================= recipe ================= */
.rhead{position:relative;overflow:hidden;background:linear-gradient(180deg,var(--lightest-kale),var(--white));
  border:1px solid var(--border);border-radius:var(--r-lg);padding:var(--s07);
  margin-bottom:var(--s07);box-shadow:var(--sh-2)}
.rhead::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.06;
  background-image:var(--spark);background-size:44px 44px}
.rhead>*{position:relative;z-index:1}
.rhead h1{font-family:var(--font-serif);font-weight:400;font-size:clamp(1.7rem,3.1vw,2.4rem);
  letter-spacing:-.3px;color:var(--text-primary);margin:0;line-height:1.16;max-width:28ch}
.rmeta{display:flex;gap:var(--s08);flex-wrap:wrap;margin-top:var(--s06);
  padding-top:var(--s05);border-top:1px solid var(--border)}
.rstat b{font-family:var(--font-sans);font-size:28px;font-weight:600;color:var(--text-primary);
  letter-spacing:-.3px;display:block;line-height:1.1}
.rstat span{font-size:12px;text-transform:uppercase;letter-spacing:.5px;font-weight:600;
  color:var(--emerald);display:block;margin-top:var(--s01)}
.warn{background:var(--light-opal);border:1px solid var(--opal);color:var(--teal);border-radius:var(--r-btn);
  padding:var(--s03) var(--s04);font-size:14px;line-height:1.5;margin-top:var(--s05)}

.slot{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r-card);
  padding:var(--s06);margin-bottom:var(--s04);box-shadow:var(--sh-1);transition:box-shadow .16s}
.slot:hover{box-shadow:var(--sh-2)}
.stop{display:flex;gap:var(--s05);align-items:flex-start}
.sq{width:34px;height:34px;border-radius:var(--r-btn);background:var(--darker-kale);color:var(--white);
  font-weight:600;font-size:16px;display:grid;place-items:center;flex:none}
.sbody{flex:1;min-width:0}
.stopic{font-size:12px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;
  color:var(--emerald);margin-bottom:var(--s01)}
.sname{font-size:18px;font-weight:600;color:var(--text-primary);letter-spacing:-.3px;line-height:1.3}
.tags{display:flex;gap:var(--s02);flex-wrap:wrap;margin-top:var(--s03)}
.tag{border-radius:var(--r-tag);padding:4px 12px;font-size:12px;font-weight:600;
  background:var(--lightest-green-black);color:var(--text-body);border:1px solid var(--border);
  white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.tag.time{background:var(--lighter-kale);border-color:var(--light-kale);color:var(--dark-kale)}
.tag.trim{background:var(--lighter-emerald);border-color:var(--light-emerald);color:var(--dark-kale)}
.tag.diff{background:var(--lightest-emerald);border-color:var(--lighter-emerald);color:var(--dark-kale)}
.tag.nodetail{background:var(--light-opal);border-color:var(--opal);color:var(--teal)}
.sdesc{font-size:14px;line-height:1.6;margin:var(--s04) 0 0;color:var(--text-body)}
details.alts{margin-top:var(--s04);border-top:1px solid var(--border);padding-top:var(--s03)}
details.alts summary{cursor:pointer;list-style:none;font-size:13px;font-weight:600;color:var(--emerald);
  display:inline-flex;align-items:center;gap:var(--s02);padding:var(--s01) 0}
details.alts summary::-webkit-details-marker{display:none}
details.alts summary:hover{text-decoration:underline;text-underline-offset:3px}
details.alts summary:focus-visible{outline:2px solid var(--emerald);outline-offset:2px;border-radius:4px}
.alt{border-left:2px solid var(--lighter-emerald);padding:var(--s03) 0 var(--s03) var(--s04);margin-top:var(--s03)}
.altwhy{font-size:12px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;
  color:var(--teal);margin-bottom:var(--s01)}
.altname{font-size:16px;font-weight:600;color:var(--text-primary);letter-spacing:-.3px;line-height:1.35}
.alt .sdesc{margin-top:var(--s02);font-size:14px}

/* ================= browse ================= */
.tabs{display:flex;gap:var(--s02);margin:var(--s06) 0 var(--s05);flex-wrap:wrap}
.tab{background:var(--bg-card);border:1.5px solid var(--border);color:var(--text-body);
  border-radius:var(--r-btn);padding:10px var(--s05);font-size:14px;font-weight:600;cursor:pointer;
  transition:all .15s}
.tab:hover{border-color:var(--light-emerald);color:var(--text-primary)}
.tab:focus-visible{outline:2px solid var(--emerald);outline-offset:2px}
.tab.on{background:var(--darker-kale);border-color:var(--darker-kale);color:var(--white)}
.filters{display:grid;grid-template-columns:2fr 1fr 1fr 1.2fr;gap:var(--s06);
  background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r-card);
  padding:var(--s06);margin-bottom:var(--s06);box-shadow:var(--sh-1)}
.fgroup{min-width:0}
.fgroup .label{margin-bottom:var(--s03)}
@media(max-width:1024px){.filters{grid-template-columns:1fr 1fr}}
.chips{display:flex;gap:var(--s02);flex-wrap:wrap}
.chip{border:1px solid var(--border);background:var(--bg-card);color:var(--text-body);
  border-radius:var(--r-tag);padding:5px 13px;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s}
.chip:hover{border-color:var(--light-emerald);color:var(--text-primary)}
.chip:focus-visible{outline:2px solid var(--emerald);outline-offset:2px}
.chip.on{background:var(--emerald);border-color:var(--emerald);color:var(--white)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(316px,1fr));gap:var(--s05)}
.scard,.rcard{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r-card);
  padding:var(--s06);box-shadow:var(--sh-1);text-align:left;width:100%;font-family:inherit;
  transition:transform .16s,box-shadow .16s,border-color .16s}
.rcard{cursor:pointer}
.scard:hover,.rcard:hover{border-color:var(--emerald);box-shadow:var(--sh-3);transform:translateY(-2px)}
.rcard:focus-visible{outline:none;border-color:var(--emerald);box-shadow:0 0 0 3px rgba(51,134,50,.16)}
.scard .sdesc{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.used{font-size:12px;color:var(--text-body);opacity:.72;margin:var(--s04) 0 0;line-height:1.5}
.rpath{font-size:12px;color:var(--text-body);opacity:.85;margin:var(--s03) 0 0;line-height:1.5}
.count{font-size:14px;color:var(--text-body);margin:0 0 var(--s05)}
.empty{background:var(--bg-card);border:1px dashed var(--border);border-radius:var(--r-card);
  padding:var(--s10) var(--s06);text-align:center;color:var(--text-body)}
.empty p{margin:0}

/* ================= misc ================= */
.kbd{border:1px solid var(--border);background:var(--white);border-radius:4px;padding:2px 6px;
  font-size:12px;font-weight:600;color:var(--text-body);font-family:var(--font-sans)}
.hint{font-size:12px;color:var(--text-body);opacity:.75;margin-top:var(--s07);
  display:flex;gap:var(--s05);flex-wrap:wrap;align-items:center}
.hidden{display:none!important}
footer{border-top:1px solid var(--border);margin-top:var(--s12);padding:var(--s07) 0 var(--s08)}
.frow{display:flex;align-items:center;gap:var(--s04);flex-wrap:wrap;font-size:12px;color:var(--text-body)}
/* logo renders at full Darker Kale — the brand allows only #10292C or #FFFFFF, so no opacity tint */
.flogo{width:76px;height:20px;background-color:var(--darker-kale);flex:none;
  -webkit-mask:var(--logo) left center/contain no-repeat;mask:var(--logo) left center/contain no-repeat}

@media(max-width:820px){
 .hrow{flex-wrap:wrap;gap:var(--s04);padding:var(--s04) 0}
 .searchwrap{order:3;flex-basis:100%;min-width:0}
 .hbtn{margin-left:auto}
 .rule,.wordmark{display:none}
}
@media(max-width:640px){
 .container{padding-left:var(--s05);padding-right:var(--s05)}
 main{padding:var(--s07) 0 var(--s10)}
 .opts{grid-template-columns:1fr;gap:var(--s04)}
 .grid{grid-template-columns:1fr}
 .opt,.slot,.scard,.rcard{padding:var(--s05)}
 .rhead{padding:var(--s05)}
 .rmeta{gap:var(--s06)}
 .filters{padding:var(--s05);gap:var(--s05)}
 .stop{gap:var(--s04)}
 h2.sec{margin-top:var(--s08)}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

/* ===== passphrase gate ===== */
.gate{position:fixed;inset:0;z-index:100;background:var(--darker-kale);
  display:grid;place-items:center;padding:var(--s05)}
.gatebox{width:100%;max-width:400px;display:flex;flex-direction:column;gap:var(--s04);text-align:left}
.gatelogo{width:118px;height:31px;background-color:var(--white);
  -webkit-mask:var(--logo) left center/contain no-repeat;mask:var(--logo) left center/contain no-repeat}
.gatebox h1{font-family:var(--font-serif);font-weight:400;font-size:32px;letter-spacing:-.3px;
  color:var(--white);margin:var(--s04) 0 0;line-height:1.2}
.gatebox p.gsub{font-size:14px;color:rgba(255,255,255,.72);margin:0}
.gatebox input[type=password]{font-family:inherit;font-size:16px;padding:12px var(--s04);
  border-radius:var(--r-btn);border:1.5px solid rgba(255,255,255,.26);
  background:rgba(255,255,255,.07);color:var(--white);width:100%}
.gatebox input[type=password]::placeholder{color:rgba(255,255,255,.42)}
.gatebox input[type=password]:focus{outline:none;border-color:var(--light-emerald);
  background:rgba(255,255,255,.13);box-shadow:0 0 0 3px rgba(127,200,124,.16)}
.gaterem{display:flex;align-items:center;gap:var(--s02);font-size:14px;color:rgba(255,255,255,.72);cursor:pointer}
.gaterem input{accent-color:var(--emerald);width:16px;height:16px;cursor:pointer}
.gatebtn{background:var(--emerald);border:0;color:var(--white);border-radius:var(--r-btn);
  padding:13px var(--s05);font-size:14px;font-weight:600;cursor:pointer;transition:background .2s}
.gatebtn:hover:not(:disabled){background:#2d7a2c}
.gatebtn:disabled{opacity:.6;cursor:default}
.gatebtn:focus-visible{outline:2px solid var(--light-emerald);outline-offset:2px}
.gateerr{font-size:14px;color:var(--light-emerald);margin:0}
.gatenote{font-size:12px;color:rgba(255,255,255,.5);margin:var(--s02) 0 0;line-height:1.5}
</style>
</head><body>

<script type="text/plain" id="appcode">
const DATA=JSON.parse(document.getElementById('data').textContent);
const Q={},R={},S=DATA.scenarios;
DATA.questions.forEach(q=>Q[q.id]=q); DATA.recipes.forEach(r=>R[r.id]=r);
const ROOT=DATA.meta.root||DATA.questions[0].id;

/* ---- label prettifier: keep acronyms, sentence-case the rest ---- */
const ACR={QA:'QA',AI:'AI',ML:'ML',SRE:'SRE',IT:'IT',SQL:'SQL',BI:'BI',COTS:'COTS',UI:'UI',UX:'UX',
 API:'API',ETL:'ETL',CLI:'CLI',RAG:'RAG',LLM:'LLM',GPU:'GPU',CSV:'CSV',EKS:'EKS',OSI:'OSI',NOSQL:'NoSQL',
 IOS:'iOS',SAAS:'SaaS',DEVOPS:'DevOps',JR:'Jr',AWS:'AWS',DB:'DB',OO:'OO',PM:'PM',BA:'BA',CRM:'CRM',MLOPS:'MLOps'};
function pretty(t){
  if(!t) return '';
  const caps=t===t.toUpperCase();
  if(!caps) return t;
  return t.split(/(\s+|\/|,)/).map((w,i)=>{
    if(/^(\s+|\/|,)$/.test(w)) return w;
    const bare=w.replace(/[^A-Za-z+#]/g,'').toUpperCase();
    if(ACR[bare]) return w.replace(/[A-Za-z+#]+/,ACR[bare]);
    if(w.length<=2&&/^[A-Z+]+$/.test(w)) return w;
    const lower=w.toLowerCase();
    return i===0?lower.charAt(0).toUpperCase()+lower.slice(1):lower;
  }).join('');
}
/* recipe titles are often ➜-delimited paths — sentence-case each segment, not just the first */
const prettyPath=t=>(t||'').split('➜').map(s=>pretty(s.trim())).filter(Boolean).join(' ➜ ');
const STD=['Basic','Intermediate','Intermediate+','Advanced'];
function diffTag(d){if(!d)return '';
  if(STD.includes(d))return '<span class="tag diff">'+esc(d)+'</span>';
  return '<span class="tag diff" title="'+esc(d)+'">Mixed</span>';}
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---- state ---- */
let path=[];            // [{q:questionId, label:optionLabel}]
let filters={discipline:null,level:null,difficulty:null,capability:null};
let tab='scenarios';
const G=document.getElementById('viewGuided'),V=document.getElementById('viewRecipe'),B=document.getElementById('viewBrowse');
const qbox=document.getElementById('q');

/* ---- routing ---- */
function hashFor(){ 
  if(mode==='browse') return '#/browse'+(qbox.value?('?q='+encodeURIComponent(qbox.value)):'');
  if(mode==='recipe') return '#/r/'+cur;
  return '#/q/'+path.map(p=>encodeURIComponent(p.label)).join('/');
}
let mode='guided',cur=ROOT;
function push(){ const h=hashFor(); if(location.hash!==h) history.pushState(null,'',h); }
window.addEventListener('popstate',fromHash);
function fromHash(){
  const h=decodeURIComponent(location.hash||'');
  if(h.startsWith('#/browse')){ const m=location.hash.match(/\?q=(.*)$/); qbox.value=m?decodeURIComponent(m[1]):''; showBrowse(false); return; }
  if(h.startsWith('#/r/')){ const id=location.hash.slice(4); if(R[id]){ cur=id;mode='recipe';render(false);return; } }
  if(h.startsWith('#/q/')){
    const labels=location.hash.slice(4).split('/').filter(Boolean).map(decodeURIComponent);
    path=[];let node=ROOT;
    for(const L of labels){ const q=Q[node]; if(!q) break; const o=q.options.find(o=>o.label===L); if(!o) break;
      path.push({q:node,label:L}); node=o.next; }
    if(R[node]){cur=node;mode='recipe';} else {cur=node;mode='guided';}
    render(false);return;
  }
  path=[];cur=ROOT;mode='guided';render(false);
}

/* ---- navigation ---- */
function choose(o){ path.push({q:cur,label:o.label}); cur=o.next; mode=R[o.next]?'recipe':'guided'; render(); }
function jump(i){ path=path.slice(0,i); cur=i===0?ROOT:(()=>{const p=path[path.length-1];return Q[p.q].options.find(o=>o.label===p.label).next;})();
  mode=R[cur]?'recipe':'guided'; render(); }
function reset(){ path=[];cur=ROOT;mode='guided';qbox.value='';render(); }
function back(){ if(mode==='browse'){reset();return;} if(path.length) jump(path.length-1); }

/* ---- breadcrumbs ---- */
function crumbs(){
  const c=document.getElementById('crumbs');
  let h='<button class="crumb home" onclick="reset()">Start</button>';
  path.forEach((p,i)=>{ h+='<span class="sep">›</span><button class="crumb'+(i===path.length-1&&mode!=='browse'?' now':'')+'" onclick="jump('+(i+1)+')">'+esc(pretty(p.label))+'</button>'; });
  if(mode==='browse') h+='<span class="sep">›</span><span class="crumb now">All scenarios</span>';
  c.innerHTML=h;
}

/* ---- render ---- */
function render(doPush=true){
  crumbs(); if(doPush) push();
  document.getElementById('browseBtn').classList.toggle('on',mode==='browse');
  G.classList.toggle('hidden',mode!=='guided'); V.classList.toggle('hidden',mode!=='recipe'); B.classList.toggle('hidden',mode!=='browse');
  if(mode==='guided') renderQ(); else if(mode==='recipe') renderR();
  window.scrollTo({top:0,behavior:'instant'});
}

function renderQ(){
  const q=Q[cur]; if(!q){G.innerHTML='<div class="empty">Nothing here</div>';return;}
  const long=q.question.length>64;
  let h='';
  if(path.length) h+='<button class="back" onclick="back()">← Back</button>';
  h+='<p class="label">Step '+(path.length+1)+'</p>';
  /* pretty() so the handful of SHOUTING questions in the deck render sentence case, per brand */
  h+='<h1 class="q'+(long?' long':'')+'">'+esc(pretty(q.question.replace(/\s*\?\s*$/,'?')))+'</h1>';
  h+='<div class="opts">';
  q.options.forEach((o,i)=>{
    const nxt=R[o.next]?'Recommendation':'One more question';
    const lbl=pretty(o.label);
    h+='<button class="opt" onclick="choose(Q[cur].options['+i+'])">'+
       (i<9?'<span class="num">'+(i+1)+'</span>':'')+
       '<span class="otxt'+(lbl.length>34?' small':'')+'">'+esc(lbl)+'</span>'+
       '<span class="onext"><span class="dotg"></span>'+nxt+'</span></button>';
  });
  h+='</div>';
  h+='<div class="hint"><span><span class="kbd">1</span>–<span class="kbd">'+Math.min(9,q.options.length)+'</span> pick</span>'+
     '<span><span class="kbd">/</span> search</span><span><span class="kbd">Esc</span> back</span></div>';
  G.innerHTML=h;
}

function durTag(it){
  const lo=it.minutesMin,hi=it.minutesMax;
  return (lo!==hi?lo+'–'+hi:hi)+' min';
}
function slotHtml(it){
  const s=S[it.scenario];
  let h='<div class="slot"><div class="stop"><div class="sq">'+it.seq+'</div><div class="sbody">';
  if(s.topic) h+='<div class="stopic">'+esc(pretty(s.topic))+'</div>';
  h+='<div class="sname">'+esc(s.name||s.title)+'</div><div class="tags">';
  h+='<span class="tag time">'+durTag(it)+'</span>';
  if(it.trimmed) h+='<span class="tag trim">trimmed from '+it.fullMinutes+' min</span>';
  if(it.extended) h+='<span class="tag trim">extended from '+it.fullMinutes+' min</span>';
  h+=diffTag(s.difficulty);
  if(it.capability||s.capability) h+='<span class="tag">'+esc(it.capability||s.capability)+'</span>';
  if(it.aiEnabledVariant) h+='<span class="tag">'+esc(it.aiEnabledVariant)+'</span>';
  if(s.hasDetailCard===false) h+='<span class="tag nodetail">no detail slide in deck</span>';
  h+='</div>';
  if(s.description) h+='<p class="sdesc">'+esc(s.description.split('\n')[0])+'</p>';
  if(it.alternatives&&it.alternatives.length){
    h+='<details class="alts"><summary>▸ '+it.alternatives.length+' alternative'+(it.alternatives.length>1?'s':'')+'</summary>';
    it.alternatives.forEach(a=>{ const as=S[a.scenario]; if(!as) return;
      h+='<div class="alt">'+(a.reason?'<div class="altwhy">'+esc(a.reason)+'</div>':'')+
         '<div class="altname">'+esc((as.topic?pretty(as.topic)+' — ':'')+(as.name||as.title))+'</div>'+
         '<div class="tags"><span class="tag time">'+(as.minutes||'?')+' min</span>'+
         diffTag(as.difficulty)+'</div>'+
         (as.description?'<p class="sdesc">'+esc(as.description.split('\n')[0])+'</p>':'')+'</div>';
    });
    h+='</details>';
  }
  h+='</div></div></div>';
  return h;
}
function renderR(){
  const r=R[cur]; if(!r){V.innerHTML='<div class="empty">Nothing here</div>';return;}
  const lo=r.totalMinutesMin,hi=r.totalMinutes;
  let h='';
  if(path.length) h+='<button class="back" onclick="back()">← Back</button>';
  h+='<div class="rhead"><p class="label">Recommended assessment</p><h1>'+esc(prettyPath(r.title))+'</h1>';
  h+='<div class="rmeta">'+
     '<div class="rstat"><b>'+(lo!==hi?lo+'–'+hi:hi)+' min</b><span>Total</span></div>'+
     '<div class="rstat"><b>'+r.items.length+'</b><span>Scenarios</span></div>'+
     (r.totalMinutes<r.totalFullMinutes?'<div class="rstat"><b>'+r.totalFullMinutes+' min</b><span>At full length</span></div>':'')+
     '</div>';
  if(r.searchOnly) h+='<div class="warn">This recommendation isn\u2019t reachable from the guided path in the source deck'+(r.superseded?' and looks superseded by a newer version':'')+'. Treat it as a reference.</div>';
  h+='</div>';
  r.items.forEach(it=>{h+=slotHtml(it);});
  h+='<h2 class="sec">Why these</h2><p class="lead">Each scenario covers a different capability so the combination gives a 360-degree read rather than three looks at the same skill. Durations shown are the lengths used in this combination — several are deliberately trimmed from the scenario\u2019s full runtime.</p>';
  V.innerHTML=h;
}

/* ---- browse ---- */
function matchText(s,t){
  if(!t) return true;
  const hay=((s.topic||'')+' '+(s.name||'')+' '+(s.description||'')+' '+(s.difficulty||'')+' '+(s.capability||'')).toLowerCase();
  return t.toLowerCase().split(/\s+/).filter(Boolean).every(w=>hay.includes(w));
}
function matchRecipe(r,t){
  if(!t) return true;
  const sc=r.items.map(i=>{const s=S[i.scenario];return (s.topic||'')+' '+(s.name||'');}).join(' ');
  const hay=(r.title+' '+(r.breadcrumb||'')+' '+(r.pathLabels||[]).join(' ')+' '+sc).toLowerCase();
  return t.toLowerCase().split(/\s+/).filter(Boolean).every(w=>hay.includes(w));
}
function setTab(t){ tab=t; renderBrowse(); }
function openRecipe(id){ const r=R[id]; path=[]; 
  if(r&&r.pathLabels&&r.pathLabels.length){ let n=ROOT;
    for(const L of r.pathLabels){ const o=(Q[n].options||[]).find(o=>o.label===L); if(!o) break; path.push({q:n,label:L}); n=o.next; } }
  cur=id; mode='recipe'; render(); }
function showBrowse(doPush=true){ mode='browse'; render(doPush); renderBrowse(); }
function setF(k,v){ filters[k]=filters[k]===v?null:v; renderBrowse(); }
function renderBrowse(){
  const t=qbox.value.trim();
  const all=Object.values(S);
  const rows=all.filter(s=>matchText(s,t)
    &&(!filters.discipline||(s.disciplines||[]).includes(filters.discipline))
    &&(!filters.level||(s.levels||[]).includes(filters.level))
    &&(!filters.difficulty||s.difficulty===filters.difficulty)
    &&(!filters.capability||(filters.capability==='Unclassified'?!s.capability:s.capability===filters.capability)))
   .sort((a,b)=>(a.topic+a.name).localeCompare(b.topic+b.name));
  const recs=Object.values(R).filter(r=>matchRecipe(r,t))
    .sort((a,b)=>a.title.localeCompare(b.title));
  let h='<p class="label">Library</p><h1 class="q long">'+(tab==='scenarios'?'All '+all.length+' scenarios, searchable':'All '+Object.keys(R).length+' recommendations, searchable')+'</h1>';
  h+='<div class="tabs">'+
     '<button class="tab'+(tab==='scenarios'?' on':'')+'" onclick="setTab(\'scenarios\')">Scenarios ('+all.length+')</button>'+
     '<button class="tab'+(tab==='recipes'?' on':'')+'" onclick="setTab(\'recipes\')">Recommendations ('+Object.keys(R).length+')</button></div>';
  if(tab==='recipes'){
    h+='<p class="count">'+recs.length+' of '+Object.keys(R).length+' recommendations'+(t?' matching \u201c'+esc(t)+'\u201d':'')+'</p>';
    if(!recs.length) h+='<div class="empty"><p>Nothing matches. Try fewer words.</p></div>';
    else{ h+='<div class="grid">';
      recs.forEach(r=>{
        const lo=r.totalMinutesMin,hi=r.totalMinutes;
        h+='<button class="rcard" onclick="openRecipe(\''+r.id+'\')"><div class="sname">'+esc(prettyPath(r.title))+'</div>'+
          '<div class="tags"><span class="tag time">'+(lo!==hi?lo+'\u2013'+hi:hi)+' min</span>'+
          '<span class="tag">'+r.items.length+' scenarios</span>'+
          (r.searchOnly?'<span class="tag nodetail">not in guided path</span>':'')+
          (r.superseded?'<span class="tag nodetail">superseded</span>':'')+'</div>'+
          '<p class="rpath">'+esc((r.pathLabels&&r.pathLabels.length?r.pathLabels.map(pretty).join(' \u203a '):(r.breadcrumb||'\u2014')))+'</p>'+
          '<p class="used">'+r.items.map(i=>esc(S[i.scenario].name||S[i.scenario].title)).join(' \u00b7 ')+'</p>'+
          '</button>';
      });
      h+='</div>'; }
    B.innerHTML=h;return;
  }
  h+='<div class="filters">';
  const groups=[['discipline','Discipline',DATA.facets.disciplines],['level','Level',DATA.facets.levels],
                ['difficulty','Difficulty',DATA.facets.difficulties],['capability','Capability',DATA.facets.capabilities]];
  groups.forEach(([k,lab,vals])=>{
    h+='<div class="fgroup"><p class="label">'+lab+'</p><div class="chips">';
    vals.forEach(v=>{h+='<button class="chip'+(filters[k]===v?' on':'')+'" onclick="setF(\''+k+'\',\''+v.replace(/'/g,"\\'")+'\')">'+esc(pretty(v))+'</button>';});
    h+='</div></div>';
  });
  h+='</div>';
  h+='<p class="count">'+rows.length+' of '+all.length+' scenarios'+(t?' matching “'+esc(t)+'”':'')+'</p>';
  if(!rows.length) h+='<div class="empty"><p>Nothing matches. Try fewer words or clear the filters.</p></div>';
  else{
    h+='<div class="grid">';
    rows.forEach(s=>{
      h+='<div class="scard">'+(s.topic?'<div class="stopic">'+esc(pretty(s.topic))+'</div>':'')+
        '<div class="sname">'+esc(s.name||s.title)+'</div><div class="tags">'+
        (s.minutes?'<span class="tag time">'+s.minutes+' min</span>':'')+
        diffTag(s.difficulty)+
        (s.capability?'<span class="tag">'+esc(s.capability)+'</span>':'')+
        (s.hasDetailCard===false?'<span class="tag nodetail">no detail slide</span>':'')+
        (s.searchOnly?'<span class="tag nodetail">not in any recommendation</span>':'')+
        '</div>'+
        (s.description?'<p class="sdesc">'+esc(s.description.split('\n')[0])+'</p>':'')+
        '<p class="used">'+(s.usedByRecipes.length?'Used in '+s.usedByRecipes.length+' recommendation'+(s.usedByRecipes.length>1?'s':''):'Searchable only')+
        (s.slide?' · deck slide '+s.slide:'')+'</p></div>';
    });
    h+='</div>';
  }
  B.innerHTML=h;
}

/* ---- events ---- */
document.getElementById('home').onclick=reset;
document.getElementById('browseBtn').onclick=()=>{ mode==='browse'?reset():showBrowse(); };
qbox.addEventListener('input',()=>{ if(mode!=='browse') showBrowse(); else {renderBrowse();push();} });
document.addEventListener('keydown',e=>{
  if(e.target===qbox){ if(e.key==='Escape'){qbox.blur();} return; }
  if(e.key==='/'){e.preventDefault();qbox.focus();return;}
  if(e.key==='Escape'){back();return;}
  if(mode==='guided'&&/^[1-9]$/.test(e.key)){ const q=Q[cur]; const o=q&&q.options[+e.key-1]; if(o){e.preventDefault();choose(o);} }
});
document.getElementById('stats').textContent=
  DATA.questions.length+' questions · '+DATA.recipes.length+' recommendations · '+Object.keys(S).length+' scenarios';
window.choose=choose;window.jump=jump;window.reset=reset;window.back=back;window.setF=setF;window.setTab=setTab;window.openRecipe=openRecipe;window.Q=Q;
Object.defineProperty(window,'cur',{get:()=>cur});
fromHash();
</script>
<script>
(function(){
 var C=JSON.parse(document.getElementById('cipher').textContent);
 var KEY='andela-sp-pass';
 var form=document.getElementById('gateform'),pw=document.getElementById('gatepw'),
     rem=document.getElementById('gaterem'),btn=document.getElementById('gatebtn'),
     err=document.getElementById('gateerr');

 function b64(s){var r=atob(s),a=new Uint8Array(r.length);for(var i=0;i<r.length;i++)a[i]=r.charCodeAt(i);return a}

 function fail(msg){err.hidden=false;err.textContent=msg;btn.disabled=false;btn.textContent='Open the picker';}

 async function unlock(pass){
  var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
  var k=await crypto.subtle.deriveKey(
    {name:'PBKDF2',salt:b64(C.salt),iterations:C.iter,hash:'SHA-256'},
    base,{name:'AES-GCM',length:256},false,['decrypt']);
  var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(C.iv)},k,b64(C.ct));
  return new TextDecoder().decode(pt);
 }

 /* hand the plaintext to the element the app already reads, then run the app verbatim */
 function boot(json){
  document.getElementById('data').textContent=json;
  var s=document.createElement('script');
  s.textContent=document.getElementById('appcode').textContent;
  document.body.appendChild(s);
  var g=document.getElementById('gate');
  if(g) g.parentNode.removeChild(g);
 }

 async function attempt(pass,remember,silent){
  try{
   var json=await unlock(pass);
   if(remember){ try{localStorage.setItem(KEY,pass)}catch(e){} }
   else { try{sessionStorage.setItem(KEY,pass)}catch(e){} }
   boot(json);
   return true;
  }catch(e){
   try{localStorage.removeItem(KEY);sessionStorage.removeItem(KEY)}catch(e2){}
   if(!silent) fail('That passphrase didn\u2019t work \u2014 check with your team lead');
   return false;
  }
 }

 if(!window.crypto||!window.crypto.subtle){
  fail('This browser can\u2019t unlock the page \u2014 try Chrome, Edge, or Firefox over https');
  pw.disabled=true;btn.disabled=true;return;
 }

 form.addEventListener('submit',function(e){
  e.preventDefault();
  if(!pw.value) return;
  err.hidden=true;btn.disabled=true;btn.textContent='Unlocking\u2026';
  attempt(pw.value,rem.checked,false);
 });

 /* already unlocked on this device or in this tab? open without asking */
 var saved=null;
 try{ saved=localStorage.getItem(KEY)||sessionStorage.getItem(KEY) }catch(e){}
 if(saved){ btn.disabled=true;btn.textContent='Unlocking\u2026';
   attempt(saved,!!localStorage.getItem(KEY),true).then(function(ok){ if(!ok){btn.disabled=false;btn.textContent='Open the picker';pw.focus();} });
 } else { pw.focus(); }
})();</script>
